<script>(function(){var S={"en":{"h":"This page got lost along the way.","b":"The link may be old or mistyped, or the page moved.","a":"Back to the docs home","u":"/","lang":"en","docs":"Docs"},"pt":{"h":"Essa página se perdeu no caminho.","b":"O link pode estar antigo, com erro de digitação, ou a página mudou de lugar.","a":"Voltar ao início da documentação","u":"/pt","lang":"pt-BR","docs":"Docs"}};
